"use strict";
/* ============================================================
   泡泡花园 Bubble Garden v0.7
   泡泡射击 + 5 章节 · 50 官方关卡 + 创意工坊（自制关卡）
   上瘾系统：连胜加成 / 最佳纪录 / 章节通关奖励 / 总星数进度
   v0.4：新手教程关 / 新泡泡介绍弹窗 / 工坊合规校验 / 难度下调
   特殊泡泡：彩虹(万能) / 炸弹(范围爆破) / 闪电(整行清除) /
             冰块(两次命中) / 石头(只能炸毁)
   v0.4 关卡平衡：限步/三星目标改为「实测可通关 + 充分余量」，
   石头与炸弹同步登场（bomb>=stone），棋盘上限 74（避免满盘无法落子），
   队列增加石头保底炸弹（有石头必给炸弹）。
   验证钩子：window.__GARDEN_TEST__
   ============================================================ */

const W = 420, H = 640;

const ROWH = R * Math.sqrt(3);

  { id:'sunset',  name:'落日晚霞', icon:'🌇', need:30,  sky:['#ffd9c2','#ffe8d0','#fff2e0'], grass:'rgba(235,180,130,.55)', hill:'rgba(220,150,120,.28)', deco:'flowers' },
  { id:'ocean',   name:'蔚蓝海滩', icon:'🌊', need:60,  sky:['#c8ecf7','#dcf5f9','#f0fbfc'], grass:'rgba(140,210,225,.6)', hill:'rgba(120,190,215,.28)', deco:'waves' },
  { id:'sakura',  name:'樱花雨',   icon:'🌸', need:90,  sky:['#fde8ef','#fff0f4','#fff8f2'], grass:'rgba(230,170,190,.5)', hill:'rgba(235,175,195,.3)', deco:'petals' },
  { id:'starlit', name:'星夜银河', icon:'🌙', need:120, sky:['#3b4a7a','#5a6ca8','#8a94c8'], grass:'rgba(70,85,140,.55)', hill:'rgba(90,105,165,.4)', deco:'stars' },
];
/* ---------- 成就馆：10 个成就，按条件自动解锁 ---------- */
const ACHIEVEMENTS = [
  { id:'first_win',  icon:'🌱', name:'初绽', desc:'通关第一个关卡',      check:s=>totalStars()>=1 },
  { id:'stars30',    icon:'⭐', name:'星光收藏家', desc:'累计收集 30 颗星', check:s=>totalStars()>=30 },
  { id:'combo5',     icon:'🔥', name:'连击高手', desc:'单局达成 ×5 连击',  check:()=>state.maxComboEver>=5 },
  { id:'popped500',  icon:'🎈', name:'泡泡猎手', desc:'累计消除 500 个泡泡', check:()=>state.totalPoppedEver>=500 },
  { id:'popped2000', icon:'🎪', name:'爆破艺术家', desc:'累计消除 2000 个泡泡', check:()=>state.totalPoppedEver>=2000 },
  { id:'streak5',    icon:'💪', name:'常胜将军', desc:'达成 5 连胜',       check:()=>state.bestStreak>=5 },
  { id:'streak10',   icon:'👑', name:'不败神话', desc:'达成 10 连胜',      check:()=>state.bestStreak>=10 },
  { id:'ch1',        icon:'🌸', name:'花园入门', desc:'通过第一章全部关卡', check:()=>state.chapterClear>=0 },
  { id:'all50',      icon:'🏆', name:'花园传说', desc:'通关全部 50 关',    check:()=>{ for(let i=1;i<=LEVELS.length;i++) if(!(state.starMap[i]>0)) return false; return true; } },
  { id:'daily',      icon:'📅', name:'每日园丁', desc:'完成一次每日挑战',   check:()=>Object.keys(state.dailyDates).length>=1 },
];
function unlockAch(id){
  if(state.ach[id]) return false;
  const a=ACHIEVEMENTS.find(x=>x.id===id);
  if(!a) return false;
  state.ach[id]=true;
  pushPopup(a.icon, '成就解锁 · '+a.name, [a.desc, '继续收集更多成就吧！']);
  tone(880,.1,'triangle',.08); tone(1175,.14,'triangle',.07,.08);
  save();
  return true;
}
/* 统一成就巡检：关键事件后调用（胜利/消除/连击等） */
function checkAch(){ for(const a of ACHIEVEMENTS){ if(!state.ach[a.id] && a.check()) unlockAch(a.id); } }
/* ---------- 每日挑战：日期种子 → 全服同一关 ---------- */
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dailySeed(){ const s=todayStr(); let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function buildDailyDef(seed){
  const rng=mulberry32(seed);
  const count=26+Math.floor(rng()*10);   // 26~35 泡：中等规模，1~2 分钟一局
  const colors=4+Math.floor(rng()*2);    // 4~5 色
  const ice=Math.floor(rng()*3);         // 0~2 冰
  const bomb=1+Math.floor(rng()*2);      // 1~2 炸弹
  let maxRows=0, cap=0;
  while(cap<count){ cap += (maxRows%2===0?8:7); maxRows++; }
  maxRows=Math.max(3,maxRows);
  const shots=count*2+6;                 // 宽松限步：重在参与感
  return { count, colors, ice, stone:0, bomb, rate:.08, swaps:3, shots, maxRows, name:'每日挑战' };
}
/* 开始每日挑战：种子棋盘 + 确定性队列（全服同题同发牌） */
function startDaily(seedOverride){
  const seed=seedOverride!=null?seedOverride:dailySeed();
  state.dailySeed=seed;
  const def=buildDailyDef(seed);
  const rng=mulberry32((seed^0x9E3779B9)>>>0);
  state.mode='daily'; state.customDef=def; state.rngFn=rng;
  state.cells={};
  const spots=[];
  for(let r=0;r<def.maxRows && spots.length<def.count;r++){
    for(let c=0;c<colsInRow(r) && spots.length<def.count;c++) spots.push([r,c]);
  }
  for(const [r,c] of spots) setCellRaw(r,c,makeCell(Math.floor(rng()*def.colors)));
  const lower=spots.filter(([r])=>r>=2);
  const place=(t,cnt)=>{
    for(let i=0;i<cnt && lower.length;i++){
      const idx=Math.floor(rng()*lower.length);
      const [r,c]=lower.splice(idx,1)[0];
      setCellRaw(r,c,makeCell(t));
    }
  };
  place('I',def.ice); place('B',def.bomb);
  if(def.ice) maybeIntro('I');
  if(def.bomb) maybeIntro('B');
  if(def.rate>0){ maybeIntro('R'); maybeIntro('L'); }
  state.specialRate=def.rate;
  state.shotsLeft=def.shots;
  state.swapsLeft=def.swaps;
  state.score=0; state.flying=null; state.particles=[]; state.falling=[]; state.flashes=[]; state.won=false;
  state.ready=false; state.introT=performance.now()/1000; state.introConsumed=false;
  state.combo=0; state.maxCombo=0; state.totalPopped=0; state.confetti=[];
  state.isNewBest=false; state.lastBonus=0;
  state.floaters=[]; state.trail=[];
  state.hintT=4.5;
  initQueue();
  state.screen='game';
}
/* 限步/三星目标表：由「实测可通关」仿真生成（50关 × 50次真实队列模拟，v0.7 物理：悬空轻泡上飘补位）
   限步 = ceil(P90 × 1.3) + 3（前 90% 真实对局发数再留 30%+3 余量），
   三星 = ceil(P50 × 1.15) + 1（中等偏优发挥即可三星），均单调不减、三星 ≤ 限步-3 */
const SHOTS = [11,14,16,16,16,20,20,20,20,20,20,20,20,20,23,26,26,26,26,26,26,28,32,32,32,32,32,32,44,44,44,44,44,44,44,44,44,44,44,44,44,44,44,48,48,48,53,53,53,53];
const PARS  = [8,11,13,13,13,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,20,20,20,20,20,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,31,31,33,34,34,34,34];
const LEVELS = (()=>{
  const arr=[];
  let prevCount=0;
  for(let n=1;n<=50;n++){
    const t=(n-1)/49;
    // 泡泡数加速曲线：6→74（前期每关 +1 温和上手，后期每关 +2~3 陡增压迫感）
    let count = 6 + Math.round(69*Math.pow(t,1.7));
    count = Math.min(74, Math.max(count, prevCount+1));   // 上限 74：10 行容量 75，留 1 空位保证首发射得出
    prevCount = count;
    const colors= n===1?1 : n<=8?3 : n<=18?4 : n<=30?5 : 6;   // 第1关教学：单色必消
    const ice   = n<7 ?0 : Math.min(4, 1+Math.floor((n-7)/8));
    const stone = n<12?0 : Math.min(3, 1+Math.floor((n-12)/12));
    const bomb  = n<12?0 : Math.min(3, 1+Math.floor((n-12)/12));   // 与石头同步登场，保证每关炸弹≥石头
    const rate  = n<6 ?0 : Math.min(.12, .04+t*.08);
    const swaps = n<=2?1 : n<=10?2 : n<=22?3 : n<=38?4 : 5;
    let maxRows=0, cap=0;                                // 行数刚好容纳 count
    while(cap<count){ cap += (maxRows%2===0?8:7); maxRows++; }
    maxRows=Math.max(3,maxRows);
    arr.push({count,maxRows,colors,shots:SHOTS[n-1],par:PARS[n-1],rate,ice,stone,bomb,swaps});
  }
  return arr;
})();
const SAVE_KEY = 'bubble-garden-demo-v2';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const state = {
  screen:'menu',     // menu | custom | editor | game | result
  mode:'official',   // official | custom | test
  level:1,
  customIndex:-1,
  customDef:null,
  cells:{},
  shotsLeft:0,
  specialRate:0,
  score:0,
  cur:0, queue:[], dryStreak:0, swapT:0, swapsLeft:0,
  flying:null,
  aim:{ x:SX, y:SY-100, valid:false },
  particles:[],
  falling:[],
  flashes:[],
  won:false, stars:0,
  ready:false, introT:0, introConsumed:false,
  combo:0, maxCombo:0, totalPopped:0,
  muted:false, resultStart:0, starsShown:0, confetti:[],
  unlocked:1,
  starMap:{},
  bestMap:{},
  streak:0, bestStreak:0,
  menuPage:0,
  popups:[],
  seenSpecials:{},     // 已介绍过的特殊泡泡类型（持久化）
  tutorialDone:false,  // 第1关新手教程是否已完成（持久化）
  dailyBest:{}, dailyDates:{}, dailyDef:null, rngFn:null,   // 每日挑战（持久化 最佳分/已通日期）
  ach:{},              // 已解锁成就（持久化）
  themeOwned:['meadow'], themeCurrent:'meadow',             // 主题屋（持久化）
  totalPoppedEver:0, maxComboEver:0,                        // 生涯累计（持久化，供成就）
  encourage:'',        // 失败鼓励语
  shooter:{x:W/2, y:H-84},                                  // 发射炮口（可拖动）
  draggingShooter:false,                                     // 是否正在拖炮口
  floaters:[],                                               // 上飘补位动画 {fx,fy,tx,ty,cell,t}
  trail:[],                                                  // 飞行拖尾粒子
  hintT:0,                                                   // 炮口拖动提示计时（首次进关显示）
  lastBonus:0, chapterClear:-1, isNewBest:false,
  reduceMotion:false,
  shakeT:0,
  toast:null, toastT:0,
  customLevels:[],
  editor:{ cells:{}, shots:12, brush:0, dragging:false },
};
let audioCtx=null, saveAcc=0;

/* ---------------- 工具 ---------------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function key(r,c){ return r+','+c; }
function parseKey(k){ return k.split(',').map(Number); }
function getCell(r,c){ return state.cells[key(r,c)]; }
function setCellRaw(r,c,cell){ state.cells[key(r,c)]=cell; }
function delCell(r,c){ delete state.cells[key(r,c)]; }
function colsInRow(r){ return r%2===0 ? COLS : COLS-1; }
function cellX(r,c){ return BOARD_LEFT + R + c*2*R + (r%2 ? R : 0); }
function cellY(r,top){ return (top==null?BOARD_TOP:top) + R + r*ROWH; }
function toast(m){ state.toast=m; state.toastT=2.4; }
function pushPopup(icon,title,lines){ state.popups.push({icon,title,lines}); }
/* 新属性泡泡首次登场：弹出介绍并记录，避免重复打扰 */
function maybeIntro(t){
  if(state.seenSpecials[t]) return;
  state.seenSpecials[t]=true;
  const info=SPECIAL_INTRO[t];
  if(info) pushPopup(info.icon, info.title, info.lines);
  save();
}
function neighbors(r,c){
  const even = r%2===0;
  const list = even
    ? [[r,c-1],[r,c+1],[r-1,c-1],[r-1,c],[r+1,c-1],[r+1,c]]
    : [[r,c-1],[r,c+1],[r-1,c],[r-1,c+1],[r+1,c],[r+1,c+1]];
  return list.filter(([rr,cc])=> rr>=0 && cc>=0 && cc<colsInRow(rr));
}

/* ---------------- 音效 ---------------- */
function ac(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function tone(f,d,type,vol,delay){ if(state.muted) return; const a=ac(); if(!a) return; const t0=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||.1,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+d+.05); }
function sfxShoot(){ tone(520,.1,'sine',.06); }
function sfxPop(n){ for(let i=0;i<Math.min(n,5);i++) tone(600+i*110,.12,'triangle',.08,i*.04); }
function sfxBoom(){ tone(70,.35,'sine',.16); tone(140,.25,'sawtooth',.05,.03); }
function sfxZap(){ tone(1200,.18,'sawtooth',.05,0,300); }
function sfxWin(){ [523,659,784,1047].forEach((f,i)=>tone(f,.25,'sine',.09,i*.12)); }
function sfxLose(){ tone(300,.3,'sine',.08); tone(220,.4,'sine',.07,.15); }

/* ---------------- 关卡构建 ---------------- */
function makeCell(t){ return t==='I' ? {t:'I',hp:2} : {t}; }
function buildLevel(n){
  const L=LEVELS[n-1];
  const rng=mulberry32(n*7919+13);
  state.rngFn=null;   // 官方关卡用真随机队列
  state.cells={};
  // 按 count 从顶行往下铺（泡泡数逐关加速递增 6→75）
  const spots=[];
  for(let r=0;r<L.maxRows && spots.length<L.count;r++){
    for(let c=0;c<colsInRow(r) && spots.length<L.count;c++) spots.push([r,c]);
  }
  for(const [r,c] of spots) setCellRaw(r,c,makeCell(Math.floor(rng()*L.colors)));
  // 特殊泡泡替换下半区（不改变总数）
  const lower=spots.filter(([r])=>r>=2);
  const place=(t,cnt)=>{
    for(let i=0;i<cnt && lower.length;i++){
      const idx=Math.floor(rng()*lower.length);
      const [r,c]=lower.splice(idx,1)[0];
      setCellRaw(r,c,makeCell(t));
    }
  };
  place('I',L.ice); place('S',L.stone); place('B',L.bomb);
  state.specialRate=L.rate;
  state.shotsLeft=L.shots;
  state.swapsLeft=L.swaps;
  state.score=0; state.flying=null; state.particles=[]; state.falling=[]; state.flashes=[]; state.won=false;
  state.ready=false; state.introT=performance.now()/1000; state.introConsumed=false;
  state.combo=0; state.maxCombo=0; state.totalPopped=0; state.confetti=[];
  state.isNewBest=false; state.lastBonus=0;
  state.floaters=[]; state.trail=[];
  state.hintT=4.5;   // 进关提示「炮口可拖动」
  // 首次登场的新属性泡泡 → 屏幕弹介绍（已看过的类型不再打扰）
  if(L.ice) maybeIntro('I');
  if(L.stone) maybeIntro('S');
  if(L.bomb) maybeIntro('B');
  if(L.rate>0){ maybeIntro('R'); maybeIntro('L'); }
  initQueue();
}
function buildCustom(def){
  state.rngFn=null;   // 自制关卡用真随机队列
  state.cells={};
  for(const it of def.cells){
    if(it.t===undefined || it.t===null) continue;
    if(it.t==='I') setCellRaw(it.r,it.c,{t:'I',hp:it.hp||2});
    else setCellRaw(it.r,it.c,{t:it.t});
  }
  // 自制关卡出现的新属性泡泡同样弹介绍
  const seen=new Set();
  for(const it of def.cells){
    if(it.t!=='R' && it.t!=='B' && it.t!=='L' && it.t!=='I' && it.t!=='S') continue;
    if(seen.has(it.t)) continue;
    seen.add(it.t); maybeIntro(it.t);
  }
  state.specialRate=0.10;
  state.shotsLeft=def.shots;
  state.swapsLeft=3;   // 自制关卡固定 3 次换泡
  state.score=0; state.flying=null; state.particles=[]; state.falling=[]; state.flashes=[]; state.won=false;
  state.ready=false; state.introT=performance.now()/1000; state.introConsumed=false;
  state.combo=0; state.maxCombo=0; state.totalPopped=0; state.confetti=[];
  state.isNewBest=false; state.lastBonus=0;
  state.floaters=[]; state.trail=[];
  state.hintT=4.5;
  initQueue();
}
function presentNormalColors(){
  const s=new Set();
  for(const k of Object.keys(state.cells)){ const t=state.cells[k].t; if(typeof t==='number') s.add(t); }
  return [...s];
}
function dominantColor(){
  const cnt={};
  for(const k of Object.keys(state.cells)){ const t=state.cells[k].t; if(typeof t==='number') cnt[t]=(cnt[t]||0)+1; }
  let best=null,bn=-1;
  for(const t in cnt) if(cnt[t]>bn){ bn=cnt[t]; best=+t; }
  return best;
}
function hasStones(){
  for(const k of Object.keys(state.cells)){ if(state.cells[k].t==='S') return true; }
  return false;
}
/* ---------- 智能发泡：只发场上仍存在的颜色；连歪两次发保底 ---------- */
/* 每日挑战使用确定性随机源（全服同题同队列），其它模式用 Math.random */
function gameRand(){ return state.rngFn ? state.rngFn() : Math.random(); }
function rollNew(){
  if(gameRand() < (state.specialRate||0)){
    const s=['R','B','L'];
    return s[(gameRand()*3)|0];
  }
  const pool=presentNormalColors();
  // 石头存在且当前没有炸弹在手 → 把炸弹加入候选池，保证石头永远炸得掉
  if(pool.length && hasStones() && state.cur!=='B' && !state.queue.includes('B')) pool.push('B');
  return (pool.length?pool:[0])[(gameRand()*(pool.length?pool.length:1))|0];
}
function sanitize(t){
  if(typeof t==='number'){
    const pool=presentNormalColors();
    if(pool.length && !pool.includes(t)){
      const d=dominantColor();
      return d!==null?d:pool[0];
    }
    if(!pool.length) return rollNew();
  }
  return t;
}
function initQueue(){
  state.queue=[rollNew(),rollNew(),rollNew()];
  state.cur=rollNew();
  state.dryStreak=0;
}
function advanceQueue(){
  // 保底：连续两发未消除 → 有石头发炸弹（石头只能炸毁），否则发场上占多数的颜色
  const rescue = state.dryStreak>=2;
  let nxt = state.queue.shift();
  if(rescue){
    if(hasStones()){ nxt='B'; }
    else {
      const d=dominantColor();
      if(d!==null) nxt=d;
    }
  }
  state.cur=sanitize(nxt);
  while(state.queue.length<3) state.queue.push(sanitize(rollNew()));
  sanitizeQueue();
}
/* 消除后立即全队列消毒：预览里绝不出现场上已不存在的颜色 */
function sanitizeQueue(){
  state.cur=sanitize(state.cur);
  for(let i=0;i<state.queue.length;i++) state.queue[i]=sanitize(state.queue[i]);
}
function finishShot(popped){
  if(popped>0){
    state.combo++;
    state.maxCombo=Math.max(state.maxCombo,state.combo);
    if(state.maxCombo>state.maxComboEver) state.maxComboEver=state.maxCombo;
  } else {
    state.combo=0;
  }
  advanceQueue();
  checkEnd();
}

/* ---------------- 核心逻辑 ---------------- */
function bfsWild(r,c,color){
  const seen=new Set([key(r,c)]);
  const stack=[[r,c]]; const group=[[r,c]];
  while(stack.length){
    const [cr,cc]=stack.pop();
    for(const [nr,nc] of neighbors(cr,cc)){
      const k=key(nr,nc);
      if(seen.has(k)) continue;
      const cell=getCell(nr,nc);
      if(!cell) continue;
      if(cell.t===color || cell.t==='R'){ seen.add(k); stack.push([nr,nc]); group.push([nr,nc]); }
    }
  }
  return group;
}
function findFloating(){
  const reach=new Set(); const stack=[];
  for(let c=0;c<colsInRow(0);c++){
    if(getCell(0,c)!==undefined){ reach.add(key(0,c)); stack.push([0,c]); }
  }
  while(stack.length){
    const [cr,cc]=stack.pop();
    for(const [nr,nc] of neighbors(cr,cc)){
      const k=key(nr,nc);
      if(getCell(nr,nc)!==undefined && !reach.has(k)){ reach.add(k); stack.push([nr,nc]); }
    }
  }
  const floating=[];
  for(const k of Object.keys(state.cells)){
    if(!reach.has(k)) floating.push(parseKey(k));
  }
  return floating;
}
/* 连锁引擎：爆炸点队列 + 整行清除集合，互相触发 */
function cascade(explQueue, rows){
  let count=0;
  while(explQueue.length || rows.size){
    if(explQueue.length){
      const {x,y}=explQueue.shift();
      spawnExplosion(x,y);
      state.shakeT=Math.max(state.shakeT,.4);
      sfxBoom();
      for(const k of Object.keys(state.cells)){
        const [rr,cc]=parseKey(k);
        const dx=cellX(rr,cc)-x, dy=cellY(rr)-y;
        if(dx*dx+dy*dy <= BOMB_RAD*BOMB_RAD){
          const cell=getCell(rr,cc);
          delCell(rr,cc); count++;
          state.score += cell.t==='S' ? 30 : 10;
          spawnPop(cellX(rr,cc),cellY(rr),cell);
          if(cell.t==='B') explQueue.push({x:cellX(rr,cc),y:cellY(rr)});
          if(cell.t==='L') rows.add(rr);
        }
      }
    } else {
      const r=[...rows][0]; rows.delete(r);
      state.flashes.push({r, t:0});
      sfxZap();
      for(let c=0;c<colsInRow(r);c++){
        const cell=getCell(r,c);
        if(!cell || cell.t==='S') continue;
        delCell(r,c); count++; state.score+=10;
        spawnPop(cellX(r,c),cellY(r),cell);
        if(cell.t==='B') explQueue.push({x:cellX(r,c),y:cellY(r)});
      }
    }
  }
  return count;
}
function popGroup(keys){
  const mult=Math.min(5,state.combo+1);   // 连击倍率：连消第N发 ×N（上限×5）
  let popped=0;
  const explQueue=[]; const rows=new Set();
  const removed=new Set();
  for(const k of keys){
    const [r,c]=parseKey(k);
    const cell=getCell(r,c);
    if(!cell) continue;
    removed.add(k); delCell(r,c); popped++; state.score+=10*mult;
    spawnPop(cellX(r,c),cellY(r),cell);
    if(cell.t==='B') explQueue.push({x:cellX(r,c),y:cellY(r)});
    if(cell.t==='L') rows.add(r);
  }
  popped += cascade(explQueue, rows);
  // 相邻冰块受损
  const damaged=new Set();
  for(const k of removed){
    const [r,c]=parseKey(k);
    for(const [nr,nc] of neighbors(r,c)){
      const nk=key(nr,nc);
      if(damaged.has(nk)) continue;
      const nb=getCell(nr,nc);
      if(nb && nb.t==='I'){
        damaged.add(nk); nb.hp--;
        if(nb.hp<=0){ delCell(nr,nc); popped++; state.score+=15; spawnPop(cellX(nr,nc),cellY(nr),nb); }
      }
    }
  }
  // v0.7 物理：悬空泡泡——轻泡上飘补位（保留），石头/炸弹抛物线坠落（消除）
  const dropped = physicsSettle();
  if(popped>0) sfxPop(Math.min(popped,6));
  sanitizeQueue();
  checkEnd();
  return {popped,dropped};
}
/* ---------- v0.7 物理引擎：悬空泡泡行为 ----------
   轻泡泡（普通色/R/L/I）：失去支撑后上飘，向上找空格补位（保留在棋盘）；
     若上方完全堵死无法补位，则持续上飘出屏（消除 +20 分）。
   重泡泡（石头 S/炸弹 B）：不补位，抛物线抛出坠落（消除 +20 分）。 */
function physicsSettle(){
  // 第一遍：轻泡上飘补位（多轮直到稳定）
  let moved=true, guard=0;
  while(moved && guard<12){
    moved=false; guard++;
    const floating=findFloating();
    if(!floating.length) break;
    for(const [r,c] of floating){
      const cell=getCell(r,c);
      if(!cell) continue;
      if(cell.t==='S' || cell.t==='B') continue;      // 重物不补位
      for(let ur=r-1; ur>=0; ur--){
        let cand=null;
        for(const cc of [c-1,c,c+1]){
          if(cc>=0 && cc<colsInRow(ur) && getCell(ur,cc)===undefined){ cand=[ur,cc]; break; }
        }
        if(cand){
          state.floaters.push({fx:cellX(r,c), fy:cellY(r), tx:cellX(cand[0],cand[1]), ty:cellY(cand[0]), cell, t:0, fromK:key(r,c), toK:key(cand[0],cand[1])});
          delCell(r,c); setCellRaw(cand[0],cand[1],cell);
          moved=true;
          break;
        }
      }
    }
  }
  // 第二遍：仍未补位的（轻泡堵死 / 重物）→ 物理动画离开棋盘并消除
  let dropped=0;
  for(const [fr,fc] of findFloating()){
    const cell=getCell(fr,fc);
    if(!cell) continue;
    delCell(fr,fc); dropped++; state.score+=20;
    if(cell.t==='S' || cell.t==='B'){
      // 重物：抛物线抛出（高抛 + 水平掷出 + 慢重力 → 轨迹清晰可辨）
      state.falling.push({x:cellX(fr,fc), y:cellY(fr), vx:(Math.random()-.5)*220, vy:-170-Math.random()*120, grav:430, cell});
    } else {
      // 轻泡：向上飘出屏幕（浮力向上，慢速优雅）
      state.falling.push({x:cellX(fr,fc), y:cellY(fr), vx:(Math.random()-.5)*60, vy:-40-Math.random()*40, grav:-50, cell});
    }
  }
  return dropped;
}
function resolveShot(r,c){
  const cell=getCell(r,c);
  if(!cell) return {popped:0,dropped:0};
  let group;
  if(cell.t==='R'){
    const counts={};
    for(const [nr,nc] of neighbors(r,c)){
      const nb=getCell(nr,nc);
      if(nb && typeof nb.t==='number') counts[nb.t]=(counts[nb.t]||0)+1;
    }
    let best=null,bn=0;
    for(const t in counts) if(counts[t]>bn){ bn=counts[t]; best=+t; }
    if(best===null) return {popped:0,dropped:0};
    group=bfsWild(r,c,best);
  } else {
    group=bfsWild(r,c,cell.t);
  }
  if(group.length>=3) return popGroup(group.map(([gr,gc])=>key(gr,gc)));
  return {popped:0,dropped:0};
}
/* 落地结算统一入口：无论是否消除都要推进队列并检查胜负 */
function settleLanding(popped){
  state.totalPopped+=popped;
  state.totalPoppedEver+=popped;                      // 生涯累计（成就）
  if(state.maxCombo>state.maxComboEver) state.maxComboEver=state.maxCombo;
  finishShot(popped);
}
function checkEnd(){
  if(state.screen==='result') return;   // 幂等：已结算不再重复
  const remaining=Object.keys(state.cells).length;
  if(remaining===0){
    state.won=true;
    state.resultStart=performance.now()/1000;
    state.starsShown=0;
    const total = state.mode==='official' ? LEVELS[state.level-1].shots : (state.customDef?state.customDef.shots:state.shotsLeft);
    const used = total - state.shotsLeft;
    const par = state.mode==='official' ? LEVELS[state.level-1].par : Math.max(6, Math.round(total*0.7));
    state.stars = used<=par ? 3 : used<=par+2 ? 2 : 1;
    if(state.mode==='daily'){
      // 每日挑战：记录当日通关与最佳分，不解锁官方进度
      const d=todayStr();
      state.dailyDates[d]=true;
      const prevBest=state.dailyBest[d]||0;
      state.isNewBest = state.score>prevBest;
      if(state.isNewBest) state.dailyBest[d]=state.score;
      pushPopup('📅','每日挑战完成！',[todayStr()+' · 得分 '+state.score,(state.isNewBest&&prevBest>0)?'刷新今日最佳纪录！':'明日同一时间再来挑战']);
      checkAch();
    }
    if(state.mode==='official'){
      state.starMap[state.level]=Math.max(state.starMap[state.level]||0, state.stars);
      state.unlocked=Math.max(state.unlocked, Math.min(LEVELS.length, state.level+1));
      // 连胜 + 奖金：连赢越多，每关额外分越多
      state.streak++; state.bestStreak=Math.max(state.bestStreak,state.streak);
      state.lastBonus = state.streak>=2 ? state.streak*30 : 0;
      state.score += state.lastBonus;
      // 最佳纪录
      const prev=state.bestMap[state.level]||0;
      state.isNewBest = state.score>prev;
      if(state.isNewBest) state.bestMap[state.level]=state.score;
      // 章节通关检测（每章 10 关全通 → 奖励弹窗 +200）
      const ch=Math.floor((state.level-1)/10);
      let chDone=true;
      for(let i=ch*10+1;i<=ch*10+10;i++) if(!(state.starMap[i]>0)){ chDone=false; break; }
      if(chDone && state.chapterClear<ch){
        state.chapterClear=ch; state.score+=200;
        pushPopup(CHAPTERS[ch].icon, CHAPTERS[ch].name+' · 章节通关！', ['本章 10 关全部通关','章节奖励 +200 分']);
      }
      if(state.isNewBest && prev>0) pushPopup('🏆','新纪录！',['第 '+state.level+' 关最佳成绩刷新','得分 '+state.score]);
      if(state.streak>=5 && state.streak%5===0) pushPopup('🔥','连胜 ×'+state.streak, ['连赢加成持续累计中','历史最高连胜 '+state.bestStreak]);
      checkAch();
    }
    state.screen='result'; sfxWin(); save();
    if(state.mode==='official' && state.level===1 && !state.tutorialDone){
      state.tutorialDone=true; save();
    }
  } else if(state.shotsLeft<=0 && !state.flying){
    state.won=false; state.screen='result'; state.resultStart=performance.now()/1000; state.starsShown=0;
    if(state.mode==='official') state.streak=0;
    // 失败鼓励语：随机一句暖心话，减少挫败感
    const cheers=['差一点点就成功啦！','换个思路，马上就能过！','花园永远为你敞开 🌱','深呼吸，下一发就是奇迹！','高手都是从这里开始的～'];
    state.encourage=cheers[(Math.random()*cheers.length)|0];
    sfxLose(); save();
  }
}

/* ---------------- 发射物理 ---------------- */
function findSnapCell(px,py){
  let best=null, bestD=Infinity;
  for(let r=0;r<=13;r++){
    const cn=colsInRow(r);
    for(let c=0;c<cn;c++){
      if(getCell(r,c)!==undefined) continue;
      const adj = r===0 || neighbors(r,c).some(([nr,nc])=>getCell(nr,nc)!==undefined);
      if(!adj) continue;
      const dx=px-cellX(r,c), dy=py-cellY(r);
      const d=dx*dx+dy*dy;
      if(d<bestD){ bestD=d; best={r,c}; }
    }
  }
  return best;
}
function shoot(){
  if(state.screen!=='game' || !state.ready || state.flying || state.shotsLeft<=0) return;
  if(!state.aim.valid) return;
  let dx=state.aim.x-state.shooter.x, dy=state.aim.y-state.shooter.y;
  const len=Math.hypot(dx,dy); if(len<1) return;
  dx/=len; dy/=len;
  if(dy>-0.15) return;
  state.flying={x:state.shooter.x,y:state.shooter.y,vx:dx*SPEED,vy:dy*SPEED,color:state.cur};
  state.shotsLeft--;
  sfxShoot();
}
function afterSpecialHit(){ settleLanding(0); }
function stepFlying(dt){
  const f=state.flying; if(!f) return;
  f.x+=f.vx*dt; f.y+=f.vy*dt;
  // 飞行拖尾：每帧留 2 个渐隐粒子（物理轨迹可视化）
  if(!state.reduceMotion){
    for(let i=0;i<2;i++){
      state.trail.push({x:f.x+(Math.random()-.5)*4, y:f.y+(Math.random()-.5)*4,
        t:0, life:.22, color:typeof f.color==='number'?PALETTE[f.color%PALETTE.length].main
          : f.color==='R'?'#e8e0ff': f.color==='B'?'#8a929e': f.color==='L'?'#ffd97a':'#bfe6fa'});
    }
  }
  if(f.x<R){f.x=R;f.vx=-f.vx;}
  if(f.x>W-R){f.x=W-R;f.vx=-f.vx;}
  let hit = f.y-R <= BOARD_TOP;
  if(!hit){
    for(const k of Object.keys(state.cells)){
      const [r,c]=parseKey(k);
      const dx=f.x-cellX(r,c), dy=f.y-cellY(r);
      if(dx*dx+dy*dy < (2*R-3)*(2*R-3)){ hit=true; break; }
    }
  }
  if(hit){
    state.flying=null;
    state.trail.length=0;
    if(f.color==='B'){
      const n=cascade([{x:f.x,y:f.y}], new Set());
      settleLanding(n);
    } else if(f.color==='L'){
      const r=Math.max(0, Math.round((f.y-BOARD_TOP-R)/ROWH));
      const n=cascade([], new Set([r]));
      settleLanding(n);
    } else {
      const snap=findSnapCell(f.x,f.y) || {r:0,c:Math.max(0,Math.min(colsInRow(0)-1,Math.round((f.x-BOARD_LEFT-R)/(2*R))))};
      setCellRaw(snap.r,snap.c,makeCell(f.color));
      const res=resolveShot(snap.r,snap.c);
      settleLanding(res.popped);
    }
  } else if(f.y>H+R){
    state.flying=null; state.trail.length=0; settleLanding(0);
  }
}

/* ---------------- 粒子特效 ---------------- */
function spawnPop(x,y,cell){
  const n=state.reduceMotion?3:8;
  const t=cell?cell.t:0;
  const color = typeof t==='number' ? PALETTE[t%PALETTE.length].main
    : t==='R' ? '#e8e0ff' : t==='B' ? '#6a707a' : t==='L' ? '#ffd97a' : t==='I' ? '#bfe6fa' : '#9aa0a8';
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=60+Math.random()*120;
    state.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,t:0,life:.5+Math.random()*.3,color,r:2+Math.random()*3});
  }
}
function spawnExplosion(x,y){
  const n=state.reduceMotion?6:18;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=90+Math.random()*180;
    state.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:.55+Math.random()*.3,color:Math.random()<.5?'#ffb38a':'#ffd97a',r:2.5+Math.random()*3});
  }
}

/* ---------------- 创意工坊 ---------------- */
const BRUSHES=[0,1,2,3,4,5,'R','B','L','I','S','E'];
function edCellAt(x,y){
  for(let r=0;r<ED_ROWS;r++){
    for(let c=0;c<colsInRow(r);c++){
      const dx=x-cellX(r,c), dy=y-cellY(r,ED_TOP);
      if(dx*dx+dy*dy < R*R) return {r,c};
    }
  }
  return null;
}
function edPaint(x,y){
  const hit=edCellAt(x,y);
  if(!hit) return;
  const k=key(hit.r,hit.c);
  if(state.editor.brush==='E') delete state.editor.cells[k];
  else state.editor.cells[k]=state.editor.brush;
}
function editorDef(){
  const cells=Object.entries(state.editor.cells).map(([k,t])=>{
    const [r,c]=parseKey(k);
    return {r,c,t};
  });
  return { shots:state.editor.shots, cells };
}
/* 工坊关卡合规校验：返回问题数组（空数组 = 合规可玩）
   规则：①至少3个可消除的普通泡泡 ②步数≥理论最少发数 ③有石头必须配炸弹 ④颜色数不能超过可及容量 */
function validateCustomDef(def){
  const issues=[];
  const cells=(def.cells||[]).filter(it=>it.t!==undefined && it.t!==null);
  const normals=cells.filter(it=>typeof it.t==='number');
  const specials=cells.filter(it=>typeof it.t!=='number');
  const tSet=new Set(normals.map(it=>it.t));
  if(cells.length<3) issues.push('至少需要 3 个泡泡');
  else if(!normals.length) issues.push('至少需要 3 个普通颜色泡泡才能消除');
  else if(tSet.size>6) issues.push('普通颜色最多 6 种');
  if(tSet.size===1 && normals.length<3) issues.push('单色泡泡不足 3 个无法消除');
  if(tSet.size>=2 && normals.length<6) issues.push('多色布局至少需要 6 个普通泡泡');
  if(!specials.length && normals.length<3) issues.push('没有可消除的三连组合');
  // 步数下限：理论最少发数
  const minShots=Math.ceil(normals.length/3)+Math.ceil(specials.length/2);
  if(def.shots<minShots) issues.push('步数 '+def.shots+' 不足（理论最少 '+minShots+' 步）');
  // 石头必须有炸弹可炸
  const hasStone=specials.some(it=>it.t==='S');
  const hasBomb=specials.some(it=>it.t==='B');
  if(hasStone && !hasBomb) issues.push('有石头但没有炸弹，石头无法清除');
  if(hasBomb && specials.every(it=>it.t!=='S') && !hasStone && specials.length>0 && normals.length<3) issues.push('炸弹无法独立通关，需要普通泡泡');
  return issues;
}
function saveCustom(){
  const def=editorDef();
  if(!def.cells.length){ toast('先画一些泡泡再保存吧'); return false; }
  const issues=validateCustomDef(def);
  if(issues.length){ toast('⚠ 关卡不合规：'+issues[0]); return false; }
  if(state.customLevels.length>=12){ toast('工坊最多保存 12 个关卡'); return false; }
  state.customLevels.push({ name:'我的关卡 '+(state.customLevels.length+1), shots:def.shots, cells:def.cells });
  save();
  toast('已保存到创意工坊！');
  return true;
}
function startPlaytest(){
  const def=editorDef();
  if(!def.cells.length){ toast('先画一些泡泡再试玩'); return; }
  const issues=validateCustomDef(def);
  if(issues.length){ toast('⚠ 关卡不合规：'+issues[0]); return; }
  state.mode='test'; state.customDef=def;
  buildCustom(def);
  state.screen='game';
}

/* ---------------- 布局常量 ---------------- */
const PAL_Y=64, PAL_H=36;
function palX(i){ return 13 + i*33; }

function menuWorkshopBtn(){ return {x:W/2-110,y:500,w:220,h:48}; }
/* 菜单功能入口行：每日挑战 / 成就馆 / 主题屋 */
function menuFeatureBtns(){

/* ---------------- 输入 ---------------- */
function canvasXY(e){ const r=canvas.getBoundingClientRect(); return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) }; }
function inBox(p,b){ return p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h; }
function updateAim(p){ if(!state.ready) return; state.aim.valid = p.y-state.shooter.y < -10; state.aim.x=p.x; state.aim.y=p.y; }

canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); ac(); handleDown(canvasXY(e)); });
canvas.addEventListener('pointermove', e=>{
  const p=canvasXY(e);
  if(state.screen==='game' && state.introConsumed) return;   // 开启手势中的移动不激活瞄准
  if(state.screen==='game' && state.draggingShooter){
    // 拖动炮口：限制在底部活动区（不碰到棋盘与边缘）
    state.shooter.x=Math.max(40, Math.min(W-40, p.x));
    state.shooter.y=Math.max(H-160, Math.min(H-36, p.y));
    state.aim.valid=false;
    return;
  }
  if(state.screen==='game') updateAim(p);
  if(state.screen==='editor' && state.editor.dragging) edPaint(p.x,p.y);
});
canvas.addEventListener('pointerup', e=>{ e.preventDefault(); handleUp(canvasXY(e)); });
canvas.addEventListener('pointercancel', ()=>{ state.editor.dragging=false; state.draggingShooter=false; });
canvas.addEventListener('contextmenu', e=>e.preventDefault());

function menuGridHit(p){
  // 每页 10 关：5 列 × 2 行
  const gx=12, gy=210, bw=68, bh=76, gap=14;
  for(let i=0;i<10;i++){
    const lv=state.menuPage*10+i+1;
    if(lv>LEVELS.length) break;
    const col=i%5, row=(i/5)|0;
    const x=gx+col*(bw+gap), y=gy+row*(bh+gap);
    if(p.x>=x && p.x<=x+bw && p.y>=y && p.y<=y+bh) return lv;
  }
  return 0;
}
function chapterTabHit(p){
  if(p.y<106 || p.y>136) return -1;
  for(let i=0;i<5;i++){
    const x=8+i*82;
    if(p.x>=x && p.x<=x+76) return i;
  }
  return -1;
}
function totalStars(){ let s=0; for(let i=1;i<=LEVELS.length;i++) s+=state.starMap[i]||0; return s; }
function customRowHit(p){
  for(let i=0;i<state.customLevels.length;i++){
    const y=110+i*58;
    if(p.y>=y && p.y<=y+50) return i;
  }
  return -1;
}
function handleDown(p){
  // 奖励弹窗：点按任意位置关闭
  if(state.popups.length){ state.popups.shift(); tone(600,.08,'triangle',.06); return; }
  if(state.screen==='game' && !state.ready){
    // 开场确认层：本次点击只用于开启，绝不发射（up 事件一并吞掉）
    state.ready=true; state.introConsumed=true; state.aim.valid=false;
    tone(880,.08,'triangle',.08); tone(1175,.1,'triangle',.06,.07);
    return;
  }
  if(state.introConsumed && state.screen==='game'){
    // 同一次点击的后续事件继续吞掉
    return;
  }
  if(state.screen==='menu'){
    if(inSound(p)){ toggleMute(); return; }
    if(inReduce(p)){ toggleReduce(); return; }
    const tab=chapterTabHit(p);
    if(tab>=0){ state.menuPage=tab; tone(700,.06,'triangle',.05); save(); return; }
    const lv=menuGridHit(p);
    if(lv>0 && lv<=state.unlocked){ state.mode='official'; state.level=lv; buildLevel(lv); state.screen='game'; return; }
    for(const b of menuFeatureBtns()){
      if(inBox(p,b)){
        tone(700,.06,'triangle',.05);
        if(b.id==='daily'){ state.screen='daily'; }
        else if(b.id==='ach'){ state.screen='ach'; }
        else { state.screen='themes'; }
        return;
      }
    }
    if(inBox(p,menuWorkshopBtn())){ state.screen='custom'; return; }
    return;
  }
  if(state.screen==='daily'){
    if(inSound(p)){ toggleMute(); return; }
    if(inBack(p)){ state.screen='menu'; return; }
    // 开始今日挑战按钮
    if(p.x>=W/2-110 && p.x<=W/2+110 && p.y>=430 && p.y<=482){
      const d=todayStr();
      if(state.dailyDates[d]){ toast('今日挑战已完成，明天再来～'); return; }
      startDaily(); return;
    }
    return;
  }
  if(state.screen==='ach'){
    if(inSound(p)){ toggleMute(); return; }
    if(inBack(p)){ state.screen='menu'; return; }
    return;
  }
  if(state.screen==='themes'){
    if(inSound(p)){ toggleMute(); return; }
    if(inBack(p)){ state.screen='menu'; return; }
    const ts=totalStars();
    for(let i=0;i<THEMES.length;i++){
      const y=118+i*72;
      if(p.y>=y && p.y<=y+62 && p.x>=16 && p.x<=W-16){
        const th=THEMES[i];
        if(state.themeOwned.includes(th.id)){
          state.themeCurrent=th.id; tone(800,.08,'triangle',.07); save();
          toast('已切换到「'+th.name+'」主题');
        } else if(ts>=th.need){
          state.themeOwned.push(th.id); state.themeCurrent=th.id;
          tone(880,.1,'triangle',.08); tone(1175,.14,'triangle',.07,.08);
          save(); toast('🎉 解锁「'+th.name+'」主题！');
        } else {
          toast('还差 '+(th.need-ts)+' 颗星解锁「'+th.name+'」');
        }
        return;
      }
    }
    return;
  }
  if(state.screen==='custom'){
    if(inSound(p)){ toggleMute(); return; }
    if(inBack(p)){ state.screen='menu'; return; }
    if(inBox(p,cusNewBtn())){ state.editor={cells:{},shots:12,brush:0,dragging:false}; state.screen='editor'; return; }
    const i=customRowHit(p);
    if(i>=0){
      if(p.x>W-64){ state.customLevels.splice(i,1); save(); toast('已删除'); return; }
      const lv=state.customLevels[i];
      const issues=validateCustomDef(lv);
      if(issues.length){ toast('⚠ 该关卡不合规：'+issues[0]); return; }
      state.mode='custom'; state.customIndex=i; state.customDef=lv;
      buildCustom(lv); state.screen='game';
    }
    return;
  }
  if(state.screen==='editor'){
    if(inBack(p)){ state.screen='custom'; return; }
    // 步数 +/-
    if(p.x>=300 && p.x<=332 && p.y>=10 && p.y<=42){ state.editor.shots=Math.max(5,state.editor.shots-1); return; }
    if(p.x>=376 && p.x<=408 && p.y>=10 && p.y<=42){ state.editor.shots=Math.min(40,state.editor.shots+1); return; }
    // 画笔
    if(p.y>=PAL_Y && p.y<=PAL_Y+PAL_H){
      const i=Math.floor((p.x-13)/33);
      if(i>=0 && i<BRUSHES.length){ state.editor.brush=BRUSHES[i]; return; }
    }
    const b=edBtns();
    if(inBox(p,b.test)){ startPlaytest(); return; }
    if(inBox(p,b.save)){ saveCustom(); return; }
    if(inBox(p,b.back)){ state.screen='custom'; return; }
    edPaint(p.x,p.y);
    state.editor.dragging=true;
    return;
  }
  if(state.screen==='result'){
    for(const [btn,act] of resultButtons()){
      if(inBox(p,btn)){ act(); return; }
    }
    return;
  }
  if(state.screen==='game'){
    if(inSound(p)){ toggleMute(); return; }
    if(inReduce(p)){ toggleReduce(); return; }
    if(inBox(p,swapBtn())){
      if(state.flying){ toast('泡泡飞行中不能换'); return; }
      if(state.swapsLeft<=0){ toast('本关换泡次数已用完'); return; }
      const first=state.queue[0];
      state.queue[0]=state.cur;
      state.cur=first;
      state.swapsLeft--;
      state.swapT=.3; tone(700,.07,'triangle',.07);
      return;
    }
    if(inBack(p)){ state.screen= state.mode==='test' ? 'editor' : state.mode==='custom' ? 'custom' : state.mode==='daily' ? 'daily' : 'menu'; return; }
    // 按住炮口区域 → 进入拖动模式（移动吐出点），不瞄准
    const ddx=p.x-state.shooter.x, ddy=p.y-state.shooter.y;
    if(ddx*ddx+ddy*ddy <= 46*46 && !state.flying){
      state.draggingShooter=true;
      state.aim.valid=false;
      return;
    }
    updateAim(p);
  }
}
function handleUp(p){
  if(state.screen==='game'){
    if(!state.ready) return;        // 未开始不发射
    if(state.draggingShooter){       // 拖动炮口结束：移动到位，不发射
      state.draggingShooter=false;
      state.hintT=0;                  // 已学会拖动，关闭提示
      save();
      return;
    }
    if(state.introConsumed){        // 开启用的那次点击，up 不发射
      state.introConsumed=false;
      return;
    }
    updateAim(p); shoot();
  }
  if(state.screen==='editor') state.editor.dragging=false;
}
function toggleReduce(){ state.reduceMotion=!state.reduceMotion; toast(state.reduceMotion?'已减少动态效果':'动态效果已恢复'); save(); }
function toggleMute(){ state.muted=!state.muted; if(!state.muted){ tone(660,.08,'triangle',.08); tone(880,.08,'triangle',.08,.06); } toast(state.muted?'音效已关闭':'音效已开启'); save(); }
function inReduce(p){ return p.x>=W-124 && p.x<=W-12 && p.y>=10 && p.y<=40; }
function inSound(p){ return p.x>=W-124 && p.x<=W-12 && p.y>=50 && p.y<=80; }
function inBack(p){ return p.x>=12 && p.x<=88 && p.y>=10 && p.y<=40; }
function drawSoundBtn(){

}

function replayCurrent(){
  if(state.mode==='official') buildLevel(state.level);
  else if(state.mode==='daily') startDaily(state.dailySeed);

function resultButtons(){

    : ()=>{ state.screen='menu'; };
  const backLabel = state.mode==='test' ? '回到编辑器' : state.mode==='custom' ? '回到工坊' : state.mode==='daily' ? '回到每日挑战' : '回到选关';
  list.push([{x:W/2-132,y:480,w:264,h:44,label:backLabel}, backAct]);

/* ---------------- 绘制 ---------------- */
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawBubble(x,y,r,ci,alpha){
  const P=PALETTE[((ci%PALETTE.length)+PALETTE.length)%PALETTE.length];
  ctx.save(); ctx.globalAlpha=alpha==null?1:alpha;
  // 底部柔光（让泡泡像浮在空中的玻璃球）
  const soft=ctx.createRadialGradient(x,y+r*.25,r*.1,x,y,r);
  soft.addColorStop(0,'rgba(255,255,255,.28)'); soft.addColorStop(.55,'rgba(255,255,255,0)');
  ctx.fillStyle=soft; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  // 主体渐变
  const g=ctx.createRadialGradient(x-r*.32,y-r*.34,r*.08,x,y,r);
  g.addColorStop(0,P.light); g.addColorStop(.55,P.main); g.addColorStop(1,P.dark);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  // 描边：亮边 + 深色外圈（玻璃感）
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.arc(x,y,r-1,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle=P.dark; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(x,y,r-2.8,0,Math.PI*2); ctx.stroke();
  // 主高光（左上大光斑）
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.ellipse(x-r*.35,y-r*.42,r*.24,r*.16,-.6,0,Math.PI*2); ctx.fill();
  // 次高光（右下小反光点）
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.ellipse(x+r*.28,y+r*.34,r*.08,r*.05,.8,0,Math.PI*2); ctx.fill();
  // 底部月牙反光
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(x,y,r*.82,.9,2.2); ctx.stroke();
  ctx.restore();
}
function drawCellShape(x,y,r,cell,alpha){
  const t=cell.t;
  if(typeof t==='number') return drawBubble(x,y,r,t,alpha);
  ctx.save(); ctx.globalAlpha=alpha==null?1:alpha;
  if(t==='R'){
    const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
    g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#e6e0f5');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    for(let i=0;i<6;i++){
      ctx.strokeStyle=PALETTE[i].main; ctx.lineWidth=3.5;
      ctx.beginPath(); ctx.arc(x,y,r-3.5,i*Math.PI/3+.15,(i+1)*Math.PI/3-.15); ctx.stroke();
    }
    ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.ellipse(x-r*.3,y-r*.35,r*.18,r*.11,-.6,0,Math.PI*2); ctx.fill();
  } else if(t==='B'){
    const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
    g.addColorStop(0,'#7c828c'); g.addColorStop(1,'#3a3f47');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*.92,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#2c3037'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.strokeStyle='#8a929e'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(x+r*.35,y-r*.6); ctx.quadraticCurveTo(x+r*.65,y-r*.95,x+r*.85,y-r*.8); ctx.stroke();
    ctx.fillStyle='#ffb38a'; ctx.beginPath(); ctx.arc(x+r*.85,y-r*.8,3.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffd97a'; ctx.beginPath(); ctx.arc(x+r*.85,y-r*.8,1.8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(x-r*.3,y-r*.35,r*.2,r*.12,-.6,0,Math.PI*2); ctx.fill();
  } else if(t==='L'){
    const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
    g.addColorStop(0,'#fff7dd'); g.addColorStop(1,'#ffe9a8');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#e8b84a'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#f5b942';
    ctx.beginPath();
    ctx.moveTo(x+r*.15,y-r*.6); ctx.lineTo(x-r*.35,y+r*.08); ctx.lineTo(x-r*.02,y+r*.08);
    ctx.lineTo(x-r*.18,y+r*.6); ctx.lineTo(x+r*.38,y-r*.1); ctx.lineTo(x+r*.02,y-r*.1);
    ctx.closePath(); ctx.fill();
  } else if(t==='I'){
    ctx.fillStyle='rgba(190,230,250,.92)';
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#8cc9f0'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.ellipse(x-r*.3,y-r*.38,r*.24,r*.13,-.6,0,Math.PI*2); ctx.fill();
    if(cell.hp<=1){
      ctx.strokeStyle='rgba(90,140,180,.8)'; ctx.lineWidth=1.6;
      ctx.beginPath();
      ctx.moveTo(x-r*.5,y-r*.3); ctx.lineTo(x-r*.1,y); ctx.lineTo(x-r*.35,y+r*.45);
      ctx.moveTo(x-r*.1,y); ctx.lineTo(x+r*.4,y+r*.25);
      ctx.stroke();
    }
  } else if(t==='S'){
    ctx.fillStyle='#9aa0a8'; ctx.strokeStyle='#6e747c'; ctx.lineWidth=2;
    ctx.beginPath();
    const pts=[[-.9,-.25],[-.4,-.9],[.45,-.85],[.95,-.15],[.6,.8],[-.25,.95],[-.85,.5]];

function drawAim(){
  if(!state.aim.valid || state.flying) return;
  let dx=state.aim.x-state.shooter.x, dy=state.aim.y-state.shooter.y; const len=Math.hypot(dx,dy); if(len<1) return;
  dx/=len; dy/=len; if(dy>-0.15) return;
  let x=state.shooter.x,y=state.shooter.y,vx=dx,vy=dy;
  ctx.fillStyle='rgba(90,168,143,.55)';
  for(let i=0;i<40;i++){
    x+=vx*14; y+=vy*14;
    if(x<R){x=R;vx=-vx;} if(x>W-R){x=W-R;vx=-vx;}
    if(y-R<=BOARD_TOP) break;
    let stop=false;
    for(const k of Object.keys(state.cells)){ const [r,c]=parseKey(k);
      const ddx=x-cellX(r,c), ddy=y-cellY(r); if(ddx*ddx+ddy*ddy<(2*R)*(2*R)){stop=true;break;} }
    if(i%2===0){ ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill(); }
    if(stop) break;
  }
}

function drawGame(){
  drawBG();

  const t=performance.now()/1000;
  const intro=state.ready?1:Math.min(1,(t-state.introT)/1.2);
  const floatingKeys=new Set(state.floaters.map(f=>f.toK));
  let k=0;
  const rowMax={};
  for(const kk of Object.keys(state.cells)){ const r=parseKey(kk)[0]; rowMax[r]=1; }
  for(const kk of Object.keys(state.cells)){
    if(floatingKeys.has(kk)) continue;   // 补位动画中的格子暂不绘制
    const [r,c]=parseKey(kk);
    const appear = Math.min(1, Math.max(0,(intro*10-r)/1.2));

  });

  state.trail=state.trail.filter(t=>{

      // 抛物线残影：沿路径留下渐隐的同类泡泡（轨迹可视化）
      if(!state.reduceMotion && Math.random()<.85){

      }

function drawResult(){

  ctx.textAlign='center'; ctx.textBaseline='middle';
  // 结算计时（用于星星逐个弹出与彩带）
  const now=performance.now()/1000;
  const rt = state.resultStart>0 ? now-state.resultStart : 0;
  if(state.won){
    ctx.fillStyle='#3f8f77'; ctx.font='bold 34px "Segoe UI",system-ui,sans-serif';

    for(let i=0;i<3;i++){
      const th=0.5+i*0.35;
      const done = rt>th;
      const prog=Math.min(1,(rt-th)/0.3);
      const scale = done ? (1+Math.sin(Math.min(1,prog)*Math.PI)*0.35) : 0;
      if(done && i>=state.starsShown){ state.starsShown=i+1; if(!state.muted) tone(700+i*160,.18,'triangle',.09); }
      ctx.save();
      ctx.translate(W/2-64+i*64, 252);
      ctx.scale(scale,scale);

  // 本关统计卡
  const sw=state.mode==='official'?LEVELS[state.level-1].swaps:3;
  const stats=[

/* ---------------- 主循环 ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(state.screen==='game') stepFlying(dt);
  if(state.shakeT>0) state.shakeT=Math.max(0,state.shakeT-dt*1.6);
  if(state.toastT>0) state.toastT-=dt;
  if(state.hintT>0) state.hintT-=dt;
  saveAcc+=dt; if(saveAcc>5){ saveAcc=0; save(); }
  draw();
  requestAnimationFrame(frame);
}

/* 手机端适配：窄屏满宽 + 高清 DPR（上限2避免性能浪费）+ 超宽屏限高 */
function fit(){
  const vw=innerWidth, vh=innerHeight;
  const portrait = vh>vw;
  let s;
  if(portrait && vw<W){           // 竖屏手机：宽度铺满，垂直居中（高度通常够）
    s=vw/W;
  } else {
    s=Math.min(vw/W, vh/H);
  }
  const dpr=Math.min(devicePixelRatio||1, 2);   // 上限2：画面清晰且省性能
  canvas.style.width=Math.round(W*s)+'px';
  canvas.style.height=Math.round(H*s)+'px';
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // 竖屏窄机把画布上移一点，视觉重心更居中
  document.getElementById('stage').style.alignItems = (portrait && vh > H*s*1.15) ? 'flex-start' : 'center';
}
